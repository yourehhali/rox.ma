# Dev default port 8090 to leave 8080 free for the Vite/TanStack dev
# server. Override with SERVER_PORT=<port> in your shell or .env.
server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: rox-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rox}
    username: ${DATABASE_USER:rox}
    password: ${DATABASE_PASSWORD:rox}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: ma.rox.api

rox:
  jwt:
    secret: ${JWT_SECRET:dev-only-please-replace-with-a-64-char-base64-or-similar-secret-in-prod-32+}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    issuer: rox-api
  cors:
    # Dev origins: 8080 is Vite's default; 8081/8082/8083 appear when 8080 is
    # occupied by another local process. Prod is rox.ma. Override with
    # CORS_ALLOWED_ORIGINS if you use a different port.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,https://rox.ma}
  seed:
    enabled: ${ROX_SEED_ENABLED:true}
    admin-email: ${ROX_SEED_ADMIN_EMAIL:admin@rox.ma}
    admin-password: ${ROX_SEED_ADMIN_PASSWORD:rox-admin}
