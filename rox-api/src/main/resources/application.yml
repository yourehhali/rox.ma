# Dev default port 8090 to leave 8080 free for the Vite/TanStack dev
# server. Override with SERVER_PORT=<port> in your shell or .env.
server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: rox-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rox}
    username: ${DATABASE_USER:rox}
    password: ${DATABASE_PASSWORD:rox}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      # Portfolio image uploads (thumbnail + gallery). Kept modest on purpose.
      enabled: true
      max-file-size: ${ROX_UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${ROX_UPLOAD_MAX_REQUEST_SIZE:12MB}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: ma.rox.api

rox:
  jwt:
    secret: ${JWT_SECRET:dev-only-please-replace-with-a-64-char-base64-or-similar-secret-in-prod-32+}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    issuer: rox-api
  cors:
    # Dev origins: 8080 is Vite's default; 8081/8082/8083 appear when 8080 is
    # occupied by another local process. Prod is rox.ma. Override with
    # CORS_ALLOWED_ORIGINS if you use a different port.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,https://rox.ma}
  seed:
    enabled: ${ROX_SEED_ENABLED:true}
    admin-email: ${ROX_SEED_ADMIN_EMAIL:admin@rox.ma}
    admin-password: ${ROX_SEED_ADMIN_PASSWORD:rox-admin}
  verification:
    # When true, login blocks accounts older than the grace window without a verified email.
    # Ship as false and flip once SMTP is validated in prod.
    required: ${ROX_VERIFICATION_REQUIRED:false}
    grace-hours: ${ROX_VERIFICATION_GRACE_HOURS:24}
  mail:
    from: ${MAIL_FROM:ROX Agency <no-reply@rox.ma>}
  whatsapp:
    # OpenWA WhatsApp OTP gateway. These env values are first-boot defaults /
    # fallbacks; the admin panel edits the whatsapp_settings DB row which then
    # overrides them (blank DB columns fall back to these).
    enabled: ${ROX_WHATSAPP_ENABLED:false}
    base-url: ${OPENWA_URL:}
    api-key: ${OPENWA_API_KEY:}
    session-name: ${OPENWA_SESSION:rox}
    message-template: "${OPENWA_OTP_TEMPLATE:ROX — votre code de vérification : {code} (valide {minutes} min).}"
    # Admin activity notifications: push every site event (order/lead, signup,
    # client message, booking, change request) to the agency's own WhatsApp.
    notify-enabled: ${ROX_ADMIN_WHATSAPP_NOTIFY:false}
    notify-phone: ${ROX_ADMIN_WHATSAPP:}
  rate-limit:
    enabled: ${ROX_RATE_LIMIT_ENABLED:true}
    login-per-minute: ${ROX_RATE_LIMIT_LOGIN_PER_MIN:5}
    signup-per-hour: ${ROX_RATE_LIMIT_SIGNUP_PER_HOUR:2}
    contact-per-minute: ${ROX_RATE_LIMIT_CONTACT_PER_MIN:5}
    ai-draft-per-minute: ${ROX_RATE_LIMIT_AI_DRAFT_PER_MIN:4}
  upload:
    # On-disk root for admin media uploads, served publicly at public-path.
    # Mount ROX_UPLOAD_DIR as a volume so files survive container restarts.
    dir: ${ROX_UPLOAD_DIR:./uploads}
    public-path: ${ROX_UPLOAD_PUBLIC_PATH:/uploads}
    max-size-bytes: ${ROX_UPLOAD_MAX_BYTES:5242880}
  gemini:
    # Google Gemini (free tier) — powers the admin "Remplir avec l'IA" button that
    # drafts a portfolio item from a short brief. Key stays server-side; the
    # endpoint returns a draft for the form and never writes to the DB itself.
    # Free-tier stewardship: dailyLimit is our own budget (Google also caps RPM/
    # TPM/RPD per project); maxOutputTokens keeps each generation small so the
    # quota lasts. Both are surfaced in the admin UI via GET /portfolio/ai-usage.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    daily-limit: ${GEMINI_DAILY_LIMIT:50}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:700}
    # Auto brief-triage on every new order: verdict (ready / needs_admin → WhatsApp
    # alert) + a copy-ready Lovable/Trae UI prompt in the admin order view.
    # Its own daily budget so it never starves the portfolio assistant.
    order-prompt-enabled: ${GEMINI_ORDER_PROMPT_ENABLED:true}
    order-daily-limit: ${GEMINI_ORDER_DAILY_LIMIT:20}
    order-max-output-tokens: ${GEMINI_ORDER_MAX_OUTPUT_TOKENS:1100}
