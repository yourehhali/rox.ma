name: rox

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rox_api}
      POSTGRES_USER: ${POSTGRES_USER:-rox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - rox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rox} -d ${POSTGRES_DB:-rox_api}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks: [roxnet]

  api:
    build:
      context: ./rox-api
      dockerfile: Dockerfile
    image: rox-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      openwa:
        condition: service_healthy
    environment:
      SERVER_PORT: ${API_PORT:-8090}
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rox_api}
      DATABASE_USER: ${POSTGRES_USER:-rox}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — openssl rand -base64 64}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-30}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://rox.ma,https://www.rox.ma,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:3000}
      ROX_SEED_ENABLED: ${ROX_SEED_ENABLED:-true}
      ROX_SEED_ADMIN_EMAIL: ${ROX_SEED_ADMIN_EMAIL:?set ROX_SEED_ADMIN_EMAIL or disable ROX_SEED_ENABLED}
      ROX_SEED_ADMIN_PASSWORD: ${ROX_SEED_ADMIN_PASSWORD:?set ROX_SEED_ADMIN_PASSWORD or disable ROX_SEED_ENABLED}
      # SMTP for email OTP (Phase 3). Leave SMTP_HOST empty to keep mail disabled
      # and skip sends — the API still boots and signup still works.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-ROX Agency <no-reply@rox.ma>}
      # WhatsApp OTP via the internal OpenWA gateway (rox-api proxies it). The
      # admin panel edits these at runtime (whatsapp_settings DB row); env values
      # are first-boot defaults. OPENWA_API_KEY must match OpenWA's API_MASTER_KEY.
      ROX_WHATSAPP_ENABLED: ${ROX_WHATSAPP_ENABLED:-false}
      OPENWA_URL: ${OPENWA_URL:-http://openwa:2785}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION: ${OPENWA_SESSION:-rox}
      OPENWA_OTP_TEMPLATE: "${OPENWA_OTP_TEMPLATE:-ROX — votre code de vérification : {code} (valide {minutes} min).}"
      # Feature flags
      ROX_VERIFICATION_REQUIRED: ${ROX_VERIFICATION_REQUIRED:-false}
      ROX_VERIFICATION_GRACE_HOURS: ${ROX_VERIFICATION_GRACE_HOURS:-24}
      ROX_RATE_LIMIT_ENABLED: ${ROX_RATE_LIMIT_ENABLED:-true}
      ROX_RATE_LIMIT_LOGIN_PER_MIN: ${ROX_RATE_LIMIT_LOGIN_PER_MIN:-5}
      ROX_RATE_LIMIT_SIGNUP_PER_HOUR: ${ROX_RATE_LIMIT_SIGNUP_PER_HOUR:-2}
      ROX_RATE_LIMIT_CONTACT_PER_MIN: ${ROX_RATE_LIMIT_CONTACT_PER_MIN:-5}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-8090}/portfolio"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [roxnet, dokploy-network]
    # Internal-only. Traefik reaches `api:8090` via dokploy-network; the roxnet
    # bridge is only used for internal web<->api/db traffic. No host ports.
    expose:
      - "8090"

  web:
    build:
      context: ./rox-digital-agency
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.rox.ma}
    image: rox-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3000}
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WEB_PORT:-3000}/favicon.ico"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [roxnet, dokploy-network]
    # Internal-only. Traefik reaches `web:3000` via dokploy-network; the roxnet
    # bridge is only used for internal web<->api/db traffic. No host ports.
    expose:
      - "3000"

  # OpenWA — unofficial WhatsApp bridge. ENGINE_TYPE=baileys runs the lightweight
  # pure-Node/WebSocket engine (no Puppeteer + headless Chromium, so no ~1 GB extra
  # RAM). OpenWA normalizes our engine-neutral <digits>@c.us chatIds to Baileys'
  # @s.whatsapp.net JIDs internally. Internal-only: rox-api reaches it at
  # http://openwa:2785 and proxies its HTTP API, so OpenWA's own dashboard is never
  # publicly routed. Shares the API_MASTER_KEY/OPENWA_API_KEY secret with rox-api.
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.25.0
    restart: unless-stopped
    environment:
      PORT: 2785
      DATABASE_TYPE: sqlite
      DATABASE_NAME: /app/data/openwa.sqlite
      ENGINE_TYPE: baileys
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      REDIS_ENABLED: "false"
      QUEUE_ENABLED: "false"
      CACHE_ENABLED: "false"
      AUTO_START_SESSIONS: "true"
      API_MASTER_KEY: ${OPENWA_API_KEY:?set a shared OPENWA_API_KEY for OpenWA + rox-api}
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2785/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [roxnet]
    # Internal-only — no host port. rox-api talks to it over roxnet.
    expose:
      - "2785"

volumes:
  rox-pgdata:
    driver: local
  openwa-data:
    driver: local

networks:
  roxnet:
    driver: bridge
  # External network created by Dokploy — Traefik is attached to it and only
  # watches containers on this network (providers.docker.network in traefik.yml).
  # Verify the exact name on your server with:  docker network ls | grep dokploy
  dokploy-network:
    external: true
