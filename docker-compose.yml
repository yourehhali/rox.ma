name: rox

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rox_api}
      POSTGRES_USER: ${POSTGRES_USER:-rox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - rox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rox} -d ${POSTGRES_DB:-rox_api}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks: [roxnet]

  api:
    build:
      context: ./rox-api
      dockerfile: Dockerfile
    image: rox-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      openwa:
        # service_started (not healthy): a slow/unconfigured WhatsApp gateway must
        # never block the whole site. rox-api boots regardless and reports OpenWA
        # health in-band via the admin panel.
        condition: service_started
    environment:
      SERVER_PORT: ${API_PORT:-8090}
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rox_api}
      DATABASE_USER: ${POSTGRES_USER:-rox}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — openssl rand -base64 64}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-30}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://rox.ma,https://www.rox.ma,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:3000}
      ROX_SEED_ENABLED: ${ROX_SEED_ENABLED:-true}
      ROX_SEED_ADMIN_EMAIL: ${ROX_SEED_ADMIN_EMAIL:?set ROX_SEED_ADMIN_EMAIL or disable ROX_SEED_ENABLED}
      ROX_SEED_ADMIN_PASSWORD: ${ROX_SEED_ADMIN_PASSWORD:?set ROX_SEED_ADMIN_PASSWORD or disable ROX_SEED_ENABLED}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-ROX Agency <no-reply@rox.ma>}
      ROX_WHATSAPP_ENABLED: ${ROX_WHATSAPP_ENABLED:-false}
      OPENWA_URL: ${OPENWA_URL:-http://openwa:2785}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION: ${OPENWA_SESSION:-rox}
      OPENWA_OTP_TEMPLATE: "${OPENWA_OTP_TEMPLATE:-ROX — votre code de vérification : {code} (valide {minutes} min).}"
      ROX_ADMIN_WHATSAPP: ${ROX_ADMIN_WHATSAPP:-}
      ROX_ADMIN_WHATSAPP_NOTIFY: ${ROX_ADMIN_WHATSAPP_NOTIFY:-false}
      # Feature flags
      ROX_VERIFICATION_REQUIRED: ${ROX_VERIFICATION_REQUIRED:-false}
      ROX_VERIFICATION_GRACE_HOURS: ${ROX_VERIFICATION_GRACE_HOURS:-24}
      ROX_RATE_LIMIT_ENABLED: ${ROX_RATE_LIMIT_ENABLED:-true}
      ROX_RATE_LIMIT_LOGIN_PER_MIN: ${ROX_RATE_LIMIT_LOGIN_PER_MIN:-5}
      ROX_RATE_LIMIT_SIGNUP_PER_HOUR: ${ROX_RATE_LIMIT_SIGNUP_PER_HOUR:-2}
      ROX_RATE_LIMIT_CONTACT_PER_MIN: ${ROX_RATE_LIMIT_CONTACT_PER_MIN:-5}
      ROX_RATE_LIMIT_AI_DRAFT_PER_MIN: ${ROX_RATE_LIMIT_AI_DRAFT_PER_MIN:-4}
      # Portfolio media uploads (persisted on the rox-uploads volume below).
      ROX_UPLOAD_DIR: ${ROX_UPLOAD_DIR:-/app/uploads}
      ROX_UPLOAD_MAX_BYTES: ${ROX_UPLOAD_MAX_BYTES:-5242880}
      # Gemini (free tier) — powers the admin "Remplir avec l'IA" helper. Optional.
      # DAILY_LIMIT/MAX_OUTPUT_TOKENS keep us under Google's free RPM/TPM/RPD caps.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-50}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-700}
      # New-order AI triage (verdict + Lovable/Trae prompt), own daily budget.
      GEMINI_ORDER_PROMPT_ENABLED: ${GEMINI_ORDER_PROMPT_ENABLED:-true}
      GEMINI_ORDER_DAILY_LIMIT: ${GEMINI_ORDER_DAILY_LIMIT:-20}
      GEMINI_ORDER_MAX_OUTPUT_TOKENS: ${GEMINI_ORDER_MAX_OUTPUT_TOKENS:-1100}
    volumes:
      - rox-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-8090}/portfolio"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [roxnet, dokploy-network]
    expose:
      - "8090"

  web:
    build:
      context: ./rox-digital-agency
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.rox.ma}
    image: rox-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3000}
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WEB_PORT:-3000}/favicon.ico"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [roxnet, dokploy-network]
    expose:
      - "3000"
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.25.0
    restart: unless-stopped
    environment:
      PORT: 2785
      DATABASE_TYPE: sqlite
      DATABASE_NAME: /app/data/openwa.sqlite
      ENGINE_TYPE: baileys
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      REDIS_ENABLED: "false"
      QUEUE_ENABLED: "false"
      CACHE_ENABLED: "false"
      AUTO_START_SESSIONS: "true"
      API_MASTER_KEY: ${OPENWA_API_KEY:?set a shared OPENWA_API_KEY for OpenWA + rox-api}
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:2785/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [roxnet]
    expose:
      - "2785"

volumes:
  rox-pgdata:
    driver: local
  rox-uploads:
    driver: local
  openwa-data:
    driver: local

networks:
  roxnet:
    driver: bridge
  dokploy-network:
    external: true
